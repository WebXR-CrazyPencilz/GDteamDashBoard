<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMP — Production Management Portal</title>
  <link rel="stylesheet" href="css/pmp-theme.css">
  <link rel="stylesheet" href="css/pmp-components.css">
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="pmp-login-view" class="pmp-container" style="max-width:380px; margin-top:80px;">
    <div class="pmp-card">
      <div class="pmp-brand" style="margin-bottom:16px;">
        <div class="pmp-brand-mark"></div>
        <span>PMP · GD Team</span>
      </div>
      <h2 style="font-size:18px;">Sign in</h2>
      <form id="pmp-login-form">
        <div class="pmp-form-row">
          <label>Username</label>
          <input type="text" name="username" required autocomplete="username">
        </div>
        <div class="pmp-form-row">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="pmp-btn pmp-btn-primary" style="width:100%;">Sign in</button>
        <p id="pmp-login-error" style="color:var(--status-delayed); font-size:12px; margin-top:8px; display:none;"></p>
      </form>
    </div>
  </div>

  <!-- MANAGER PORTAL (Module 1 lives here; Employee portal is Module 2, not yet built) -->
  <div id="pmp-manager-portal" style="display:none;">
    <div class="pmp-topbar">
      <div class="pmp-brand">
        <div class="pmp-brand-mark"></div>
        <span>PMP · Manager — <span id="pmp-mgr-user-name"></span></span>
      </div>
      <div class="pmp-user-chip">
        <button class="pmp-btn" id="pmp-mgr-profile-nav-btn">Profile</button>
        <button class="pmp-btn" id="pmp-mgr-theme-toggle-btn">🌙</button>
        <button class="pmp-btn" id="pmp-logout-btn">Log out</button>
      </div>
    </div>
    <div class="pmp-container">
      <div style="display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--pmp-border); padding-bottom:12px;">
        <button class="pmp-btn pmp-btn-primary" id="pmp-nav-work">Work</button>
        <button class="pmp-btn" id="pmp-nav-people">People</button>
      </div>
      <div id="pmp-assignment-module"></div>
      <div id="pmp-employees-module" style="display:none;"></div>
    </div>
  </div>

  <!-- EMPLOYEE PORTAL PLACEHOLDER (Module 2 — not yet built) -->
  <div id="pmp-employee-portal" style="display:none;">
    <div class="pmp-topbar">
      <div class="pmp-brand">
        <div class="pmp-brand-mark"></div>
        <span>PMP · My Tasks</span>
      </div>
      <div class="pmp-user-chip">
        <span id="pmp-emp-user-name"></span>
        <button class="pmp-btn pmp-btn-primary" id="pmp-emp-dashboard-nav-btn">Dashboard</button>
        <button class="pmp-btn" id="pmp-emp-mytasks-nav-btn">My Tasks</button>
        <button class="pmp-btn" id="pmp-emp-timesheet-nav-btn">Timesheet</button>
        <button class="pmp-btn" id="pmp-emp-inbox-nav-btn">Inbox <span id="pmp-emp-inbox-badge" class="pmp-badge" style="display:none; background:var(--status-assigned); color:#fff;"></span></button>
        <button class="pmp-btn" id="pmp-emp-profile-nav-btn">Profile</button>
        <button class="pmp-btn" id="pmp-emp-theme-toggle-btn">🌙</button>
        <button class="pmp-btn" id="pmp-emp-logout-btn">Log out</button>
      </div>
    </div>
    <div class="pmp-container pmp-container-wide">
      <div id="pmp-emp-dashboard-module"></div>
      <div id="pmp-employee-module" style="display:none;"></div>
      <div id="pmp-emp-timesheet-module" style="display:none;"></div>
      <div id="pmp-emp-inbox-module" style="display:none;"></div>
    </div>
  </div>

  <!-- TEAM LEADER PORTAL -->
  <div id="pmp-teamlead-portal" style="display:none;">
    <div class="pmp-topbar">
      <div class="pmp-brand">
        <div class="pmp-brand-mark"></div>
        <span>PMP · Team Lead — <span id="pmp-tl-user-name"></span></span>
      </div>
      <div class="pmp-user-chip">
        <button class="pmp-btn" id="pmp-tl-inbox-nav-btn">Inbox <span id="pmp-tl-inbox-badge" class="pmp-badge" style="display:none; background:var(--status-assigned); color:#fff;"></span></button>
        <button class="pmp-btn" id="pmp-tl-profile-nav-btn">Profile</button>
        <button class="pmp-btn" id="pmp-tl-theme-toggle-btn">🌙</button>
        <button class="pmp-btn" id="pmp-tl-logout-btn">Log out</button>
      </div>
    </div>
    <div class="pmp-container">
      <div id="pmp-teamlead-module"></div>
      <div id="pmp-tl-inbox-module" style="display:none;"></div>
    </div>
  </div>

  <!-- HR PORTAL — read-only attendance/time visibility (see PmpHR / pmp-hr.js). No Inbox: HR never receives Task assignments, same reason Manager doesn't have one wired up either. -->
  <div id="pmp-hr-portal" style="display:none;">
    <div class="pmp-topbar">
      <div class="pmp-brand">
        <div class="pmp-brand-mark"></div>
        <span>PMP · HR — <span id="pmp-hr-user-name"></span></span>
      </div>
      <div class="pmp-user-chip">
        <button class="pmp-btn" id="pmp-hr-profile-nav-btn">Profile</button>
        <button class="pmp-btn" id="pmp-hr-theme-toggle-btn">🌙</button>
        <button class="pmp-btn" id="pmp-hr-logout-btn">Log out</button>
      </div>
    </div>
    <div class="pmp-container pmp-container-wide">
      <div id="pmp-hr-module"></div>
    </div>
  </div>

  <script src="js/pmp-config.js"></script>
  <script src="js/pmp-api.js"></script>
  <script src="js/pmp-utils.js"></script>
  <script src="js/pmp-inbox.js"></script>
  <script src="js/pmp-timesheet.js"></script>
  <script src="js/pmp-attendance.js"></script>
  <script src="js/pmp-assignment.js"></script>
  <script src="js/pmp-employees.js"></script>
  <script src="js/pmp-dashboard.js"></script>
  <script src="js/pmp-employee.js"></script>
  <script src="js/pmp-teamlead-dashboard.js"></script>
  <script src="js/pmp-teamlead.js"></script>
  <script src="js/pmp-hr.js"></script>
  <script>
    // Role-based routing at login — same pattern as TimeTrack's index.html
    function showView(id) {
      ['pmp-login-view', 'pmp-manager-portal', 'pmp-employee-portal', 'pmp-teamlead-portal', 'pmp-hr-portal'].forEach(v => {
        document.getElementById(v).style.display = v === id ? 'block' : 'none';
      });
    }

    async function routeToPortal(session) {
      if (session.role === PMP_CONFIG.ROLES.MANAGER || session.role === PMP_CONFIG.ROLES.ADMIN) {
        showView('pmp-manager-portal');
        document.getElementById('pmp-mgr-user-name').textContent = session.name;
        await PmpAssignment.init('pmp-assignment-module');
        await PmpEmployees.init('pmp-employees-module');
        setupManagerNav();
        document.getElementById('pmp-mgr-profile-nav-btn').addEventListener('click', () => openProfileModal(session));
        wireThemeToggle('pmp-mgr-theme-toggle-btn');
        // Manager isn't wired to the Work Inbox — the backend only fires
        // notifications at whoever a Task gets assigned to, and Manager
        // doesn't currently receive assignments. Add setupInboxNav here
        // the same way as below if that changes.
      } else if (session.role === PMP_CONFIG.ROLES.TEAM_LEAD) {
        showView('pmp-teamlead-portal');
        document.getElementById('pmp-tl-user-name').textContent = session.name;
        await PmpTeamLead.init('pmp-teamlead-module', session.employeeId);
        await setupInboxNav({
          navBtnId: 'pmp-tl-inbox-nav-btn',
          badgeId: 'pmp-tl-inbox-badge',
          mainModuleId: 'pmp-teamlead-module',
          inboxModuleId: 'pmp-tl-inbox-module',
          recipientId: session.employeeId,
          onOpenTask: ({ taskId }) => highlightElement('[data-task-card="' + taskId + '"]')
        });
        document.getElementById('pmp-tl-profile-nav-btn').addEventListener('click', () => openProfileModal(session));
        wireThemeToggle('pmp-tl-theme-toggle-btn');
      } else if (session.role === PMP_CONFIG.ROLES.HR) {
        // HR — read-only attendance/time visibility. No Inbox (HR never
        // receives Task assignments), no task/project management modules
        // — just PmpHR, same self-contained module pattern as every other
        // portal's main module.
        showView('pmp-hr-portal');
        document.getElementById('pmp-hr-user-name').textContent = session.name;
        await PmpHR.init('pmp-hr-module');
        document.getElementById('pmp-hr-profile-nav-btn').addEventListener('click', () => openProfileModal(session));
        wireThemeToggle('pmp-hr-theme-toggle-btn');
      } else {
        showView('pmp-employee-portal');
        document.getElementById('pmp-emp-user-name').textContent = session.name;
        await PmpEmployee.init('pmp-employee-module', session.employeeId);
        await setupEmployeePanels(session);
        document.getElementById('pmp-emp-profile-nav-btn').addEventListener('click', () => openProfileModal(session));
        wireThemeToggle('pmp-emp-theme-toggle-btn');
        await PmpDashboard.init('pmp-emp-dashboard-module', session.employeeId, {
          onNavigate: ({ target, extra }) => {
            if (target === 'timesheet') {
              document.getElementById('pmp-emp-timesheet-nav-btn').click();
            } else if (target === 'mytasks' || target === 'mytasks-filter') {
              document.getElementById('pmp-emp-mytasks-nav-btn').click();
              if (target === 'mytasks' && extra) {
                setTimeout(() => highlightElement('[data-assignment-card="' + extra + '"]'), 50);
              }
            }
          }
        });
      }
    }

    // Employee portal has three panels (My Tasks / Timesheet / Inbox) —
    // unlike the Team Lead's two-panel case, this needs an explicit way
    // back to My Tasks too, so it's its own switcher rather than reusing
    // setupInboxNav's binary toggle.
    async function setupEmployeePanels(session) {
      const panels = {
        dashboard: { navBtnId: 'pmp-emp-dashboard-nav-btn', moduleId: 'pmp-emp-dashboard-module' },
        mytasks: { navBtnId: 'pmp-emp-mytasks-nav-btn', moduleId: 'pmp-employee-module' },
        timesheet: { navBtnId: 'pmp-emp-timesheet-nav-btn', moduleId: 'pmp-emp-timesheet-module' },
        inbox: { navBtnId: 'pmp-emp-inbox-nav-btn', moduleId: 'pmp-emp-inbox-module' }
      };
      let timesheetLoaded = false;
      const badge = document.getElementById('pmp-emp-inbox-badge');

      function showPanel(key) {
        Object.keys(panels).forEach(k => {
          document.getElementById(panels[k].moduleId).style.display = k === key ? 'block' : 'none';
          document.getElementById(panels[k].navBtnId).classList.toggle('pmp-btn-primary', k === key);
        });
      }

      document.getElementById(panels.dashboard.navBtnId).addEventListener('click', async () => {
        showPanel('dashboard');
        await PmpDashboard.refresh();
      });

      document.getElementById(panels.mytasks.navBtnId).addEventListener('click', () => showPanel('mytasks'));

      document.getElementById(panels.timesheet.navBtnId).addEventListener('click', async () => {
        showPanel('timesheet');
        if (!timesheetLoaded) {
          timesheetLoaded = true;
          await PmpTimesheet.init('pmp-emp-timesheet-module', { mode: 'edit', employeeId: session.employeeId });
        } else {
          await PmpTimesheet.refresh();
        }
      });

      document.getElementById(panels.inbox.navBtnId).addEventListener('click', async () => {
        showPanel('inbox');
        await PmpInbox.refresh();
      });

      // Load the Inbox up front (hidden) so the unread badge is accurate
      // as soon as the portal opens, same as before.
      await PmpInbox.init('pmp-emp-inbox-module', session.employeeId, {
        onOpenTask: ({ assignmentId }) => {
          showPanel('mytasks');
          setTimeout(() => highlightElement('[data-assignment-card="' + assignmentId + '"]'), 50);
        },
        onUnreadCountChange: (count) => {
          badge.textContent = count;
          badge.style.display = count > 0 ? 'inline-block' : 'none';
        }
      });

      showPanel('dashboard'); // default view on portal open
    }

    // Shared by the Team Lead and Employee portals: loads the Inbox into its
    // (initially hidden) container so the unread badge is accurate as soon
    // as the portal opens, wires the nav button to toggle between the
    // portal's main module and the Inbox, and re-fetches on every open so
    // the list is never stale.
    async function setupInboxNav(opts) {
      const navBtn = document.getElementById(opts.navBtnId);
      const badge = document.getElementById(opts.badgeId);
      const mainModule = document.getElementById(opts.mainModuleId);
      const inboxModule = document.getElementById(opts.inboxModuleId);

      await PmpInbox.init(opts.inboxModuleId, opts.recipientId, {
        onOpenTask: (target) => {
          inboxModule.style.display = 'none';
          mainModule.style.display = 'block';
          navBtn.classList.remove('pmp-btn-primary');
          // Give the main module's DOM a beat to be visible before querying it.
          setTimeout(() => opts.onOpenTask(target), 50);
        },
        onUnreadCountChange: (count) => {
          badge.textContent = count;
          badge.style.display = count > 0 ? 'inline-block' : 'none';
        }
      });
      inboxModule.style.display = 'none'; // loaded (for the badge) but stays hidden until opened

      navBtn.onclick = async () => {
        const opening = inboxModule.style.display === 'none';
        if (opening) {
          await PmpInbox.refresh();
          mainModule.style.display = 'none';
          inboxModule.style.display = 'block';
          navBtn.classList.add('pmp-btn-primary');
        } else {
          inboxModule.style.display = 'none';
          mainModule.style.display = 'block';
          navBtn.classList.remove('pmp-btn-primary');
        }
      };
    }

    // Scrolls to and briefly outlines a card after "Open Task" switches back
    // to the main module. Fails silently if the element isn't currently
    // rendered (e.g. filtered out, or the Team Lead had switched to the
    // Employees tab) — the view still switches, it just won't highlight.
    function highlightElement(selector) {
      const el = document.querySelector(selector);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const originalBoxShadow = el.style.boxShadow;
      el.style.transition = 'box-shadow 0.3s ease';
      el.style.boxShadow = '0 0 0 3px var(--status-assigned)';
      setTimeout(() => { el.style.boxShadow = originalBoxShadow; }, 1500);
    }

    // Shared across all portals — shows read-only account info
    // (Name / Role / Employee ID) and a Change Password form that requires
    // the current password before accepting a new one (see
    // pmp_changeOwnPassword in Code.gs). Session itself doesn't store the
    // password, so nothing here needs updating in localStorage on success.
    //
    // Note for the Admin ghost account: it has no row in Employees, so a
    // password-change attempt here will fail with "Account not found" —
    // Admin's credentials are changed by editing PMP_GHOST_ADMIN in
    // Code.gs and redeploying. HR is NOT in this situation — it's a real
    // Employees-sheet row, so an HR user changes their own password
    // through this same form exactly like Employee/Manager/TeamLead.
    // Shared across all three portals — flips light/dark and updates the
    // button's icon to reflect the CURRENT state after the switch.
    function wireThemeToggle(btnId) {
      const btn = document.getElementById(btnId);
      const render = () => { btn.textContent = PmpUtils.getTheme() === 'dark' ? '☀️' : '🌙'; };
      render();
      btn.addEventListener('click', () => {
        PmpUtils.setTheme(PmpUtils.getTheme() === 'dark' ? 'light' : 'dark');
        render();
      });
    }

    function openProfileModal(session) {
      const overlay = document.createElement('div');
      overlay.className = 'pmp-modal-overlay';
      overlay.innerHTML = `
        <div class="pmp-modal">
          <div class="pmp-modal-header">
            <h3>My Profile</h3>
            <button class="pmp-modal-close">&times;</button>
          </div>
          <div class="pmp-form-row"><label>Name</label><div>${PmpUtils.escapeHtml(session.name)}</div></div>
          <div class="pmp-form-grid">
            <div class="pmp-form-row"><label>Role</label><div>${PmpUtils.escapeHtml(session.role === 'TeamLead' ? 'Team Lead' : session.role)}</div></div>
            <div class="pmp-form-row"><label>Employee ID</label><div>${PmpUtils.escapeHtml(session.employeeId)}</div></div>
          </div>
          <hr style="border:none; border-top:1px solid var(--pmp-border, #eee); margin:16px 0;">
          <h3 style="margin:0 0 12px 0; font-size:14px;">Change Password</h3>
          <form id="pmp-profile-pw-form">
            <div class="pmp-form-row">
              <label>Current Password</label>
              <input type="password" name="currentPassword" required autocomplete="current-password">
            </div>
            <div class="pmp-form-row">
              <label>New Password</label>
              <input type="password" name="newPassword" required minlength="4" autocomplete="new-password">
            </div>
            <div class="pmp-form-row">
              <label>Confirm New Password</label>
              <input type="password" name="confirmPassword" required minlength="4" autocomplete="new-password">
            </div>
            <p id="pmp-profile-pw-error" style="color:var(--status-delayed); font-size:12px; display:none;"></p>
            <p id="pmp-profile-pw-success" style="color:var(--status-completed); font-size:12px; display:none;">Password updated.</p>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
              <button type="button" class="pmp-btn pmp-modal-cancel">Close</button>
              <button type="submit" class="pmp-btn pmp-btn-primary">Update password</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(overlay);

      const close = () => overlay.remove();
      overlay.querySelector('.pmp-modal-close').addEventListener('click', close);
      overlay.querySelector('.pmp-modal-cancel').addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

      overlay.querySelector('#pmp-profile-pw-form').addEventListener('submit', async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const errorEl = document.getElementById('pmp-profile-pw-error');
        const successEl = document.getElementById('pmp-profile-pw-success');
        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        if (fd.get('newPassword') !== fd.get('confirmPassword')) {
          errorEl.textContent = 'New password and confirmation do not match';
          errorEl.style.display = 'block';
          return;
        }

        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;

        const res = await PmpApi.changeOwnPassword({
          employeeId: session.employeeId,
          currentPassword: fd.get('currentPassword'),
          newPassword: fd.get('newPassword')
        });

        if (res.success) {
          successEl.style.display = 'block';
          e.target.reset();
          PmpUtils.toast('Password updated', 'success');
        } else {
          errorEl.textContent = res.error || 'Could not update password';
          errorEl.style.display = 'block';
        }
        submitBtn.disabled = false;
      });
    }

    function setupManagerNav() {
      const workBtn = document.getElementById('pmp-nav-work');
      const peopleBtn = document.getElementById('pmp-nav-people');
      const workPanel = document.getElementById('pmp-assignment-module');
      const peoplePanel = document.getElementById('pmp-employees-module');

      workBtn.onclick = () => {
        workPanel.style.display = 'block';
        peoplePanel.style.display = 'none';
        workBtn.classList.add('pmp-btn-primary');
        peopleBtn.classList.remove('pmp-btn-primary');
      };
      peopleBtn.onclick = () => {
        workPanel.style.display = 'none';
        peoplePanel.style.display = 'block';
        peopleBtn.classList.add('pmp-btn-primary');
        workBtn.classList.remove('pmp-btn-primary');
      };
    }

    document.getElementById('pmp-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errorEl = document.getElementById('pmp-login-error');
      errorEl.style.display = 'none';

      const res = await PmpApi.login(fd.get('username'), fd.get('password'));
      if (res.success) {
        PmpUtils.setSession(res.employee);
        routeToPortal(res.employee);
      } else {
        errorEl.textContent = res.error || 'Login failed';
        errorEl.style.display = 'block';
      }
    });

    document.getElementById('pmp-logout-btn').addEventListener('click', () => {
      PmpUtils.clearSession();
      location.reload();
    });
    document.getElementById('pmp-emp-logout-btn').addEventListener('click', () => {
      PmpUtils.clearSession();
      location.reload();
    });
    document.getElementById('pmp-tl-logout-btn').addEventListener('click', () => {
      PmpUtils.clearSession();
      location.reload();
    });
    document.getElementById('pmp-hr-logout-btn').addEventListener('click', () => {
      PmpUtils.clearSession();
      location.reload();
    });

    // Restore session on load
    (function bootstrap() {
      PmpUtils.applyTheme(PmpUtils.getTheme()); // before any view renders, so there's no light-mode flash
      const session = PmpUtils.getSession();
      if (session) {
        routeToPortal(session);
      } else {
        showView('pmp-login-view');
      }
    })();
  </script>
</body>
</html>
